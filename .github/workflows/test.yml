# Self-test: builds the action image and runs it against a real local site.
# - screenshot mode exits 0 and writes images
# - baseline -> test passes on an unchanged page
# - test fails (non-zero) after an intentional visual change
#
# NOTE: Docker actions run in a container with its own loopback interface,
# so the fixture is served by an nginx service container on the job network
# and addressed by service hostname (http://site/), not 127.0.0.1.
# Fixture files are copied INTO the service container with `docker cp`:
# host bind mounts proved unreliable here (stale empty dir -> nginx 403).
name: Test action

on:
  push:
  pull_request:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    services:
      site:
        image: nginx:alpine
    steps:
      - uses: actions/checkout@v4
      - name: Write fixture site
        run: |
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture</title><style>body{font-family:sans-serif;margin:0}main{max-width:640px;margin:0 auto;padding:24px}</style></head><body><main><h1>Fixture</h1><p>Stable page.</p></main></body></html>' > /tmp/index.html
          CID=$(docker ps -q --filter "ancestor=nginx:alpine")
          docker cp /tmp/index.html "$CID:/usr/share/nginx/html/index.html"
          # The service hostname only resolves inside job containers, so there
          # is no curl check here — the action step itself is the check.
          sleep 10
      - name: Run MadScope screenshot
        id: shot
        uses: ./
        with:
          url: http://site/
          command: screenshot
          viewports: mobile desktop
      - name: Verify screenshots exist
        run: |
          test "${{ steps.shot.outputs.passed }}" = "true"
          ls .madscope/screenshots/*.png

  regression:
    runs-on: ubuntu-latest
    services:
      site:
        image: nginx:alpine
    steps:
      - uses: actions/checkout@v4
      - name: Write fixture site
        run: |
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture</title></head><body><h1>Version one</h1></body></html>' > /tmp/index.html
          CID=$(docker ps -q --filter "ancestor=nginx:alpine")
          docker cp /tmp/index.html "$CID:/usr/share/nginx/html/index.html"
          # The service hostname only resolves inside job containers (see above).
          sleep 10
      - name: Save baseline
        uses: ./
        with:
          url: http://site/
          command: baseline
          viewports: mobile
      - name: Test unchanged page (must pass)
        id: pass
        uses: ./
        with:
          url: http://site/
          command: test
          viewports: mobile
      - name: Assert pass outputs
        run: |
          test "${{ steps.pass.outputs.passed }}" = "true"
          test -f "${{ steps.pass.outputs.report }}"
      - name: Change the page on purpose
        run: |
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture</title><style>body{background:#1a2b3c;color:#fff;font-family:sans-serif;margin:0}main{max-width:640px;margin:0 auto;padding:48px}h1{font-size:64px}</style></head><body><main><h1>Version two has a completely different look</h1><p>Extra paragraph to guarantee a large visual diff.</p></main></body></html>' > /tmp/index2.html
          CID=$(docker ps -q --filter "ancestor=nginx:alpine")
          docker cp /tmp/index2.html "$CID:/usr/share/nginx/html/index.html"
          sleep 5
      - name: Test changed page (must fail)
        id: fail
        continue-on-error: true
        uses: ./
        with:
          url: http://site/
          command: test
          viewports: mobile
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: |
            .madscope/results/
            madscope-report.json
      - name: Assert failure surfaced
        run: |
          test "${{ steps.fail.outcome }}" = "failure"
          test "${{ steps.fail.outputs.passed }}" = "false"
