# Self-test: builds the action image and runs it against a real local site.
# - screenshot mode exits 0 and writes images
# - baseline -> test passes on an unchanged page
# - test fails (non-zero) after an intentional visual change
#
# NOTE: Docker actions run in a container with its own loopback interface,
# so the fixture is served by an nginx service container on the job network
# and addressed by service hostname (http://site/), not 127.0.0.1.
name: Test action

on:
  push:
  pull_request:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    services:
      site:
        image: nginx:alpine
        volumes:
          - ${{ github.workspace }}/site:/usr/share/nginx/html:ro
    steps:
      - uses: actions/checkout@v4
        with:
          # Default `clean: true` would delete + recreate site/, orphaning
          # the service container's bind mount (nginx would keep serving the
          # deleted inode). The fixture is written by later steps instead.
          clean: false
      - name: Write fixture site
        run: |
          mkdir -p site && sudo chown -R "$USER" site
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture</title><style>body{font-family:sans-serif;margin:0}main{max-width:640px;margin:0 auto;padding:24px}</style></head><body><main><h1>Fixture</h1><p>Stable page.</p></main></body></html>' > site/index.html
          # The service hostname only resolves inside job containers, so there
          # is no curl check here — the action step itself is the check.
          sleep 15
      - name: Run MadScope screenshot
        id: shot
        uses: ./
        with:
          url: http://site/
          command: screenshot
          viewports: mobile desktop
      - name: Verify screenshots exist
        run: |
          test "${{ steps.shot.outputs.passed }}" = "true"
          ls .madscope/screenshots/*.png

  regression:
    runs-on: ubuntu-latest
    services:
      site:
        image: nginx:alpine
        volumes:
          - ${{ github.workspace }}/site:/usr/share/nginx/html:ro
    steps:
      - uses: actions/checkout@v4
        with:
          # See above: keep the bind-mounted site/ directory intact.
          clean: false
      - name: Write fixture site
        run: |
          mkdir -p site && sudo chown -R "$USER" site
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture</title></head><body><h1>Version one</h1></body></html>' > site/index.html
          # The service hostname only resolves inside job containers (see above).
          sleep 15
      - name: Diagnose service mount
        if: always()
        run: |
          docker ps --format '{{.ID}} {{.Names}} {{.Image}}'
          for c in $(docker ps -q); do echo "== $c"; docker inspect "$c" --format '{{.Name}} {{json .Mounts}}' 2>/dev/null || true; done
          ls -la site/
      - name: Save baseline
        uses: ./
        with:
          url: http://site/
          command: baseline
          viewports: mobile
      - name: Test unchanged page (must pass)
        id: pass
        uses: ./
        with:
          url: http://site/
          command: test
          viewports: mobile
      - name: Assert pass outputs
        run: |
          test "${{ steps.pass.outputs.passed }}" = "true"
          test -f "${{ steps.pass.outputs.report }}"
      - name: Change the page on purpose
        run: |
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture</title><style>body{background:#1a2b3c;color:#fff;font-family:sans-serif;margin:0}main{max-width:640px;margin:0 auto;padding:48px}h1{font-size:64px}</style></head><body><main><h1>Version two has a completely different look</h1><p>Extra paragraph to guarantee a large visual diff.</p></main></body></html>' > site/index.html
          sleep 5
          cat site/index.html | head -c 120
          echo
      - name: Test changed page (must fail)
        id: fail
        continue-on-error: true
        uses: ./
        with:
          url: http://site/
          command: test
          viewports: mobile
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: |
            .madscope/results/
            madscope-report.json
      - name: Assert failure surfaced
        run: |
          test "${{ steps.fail.outcome }}" = "failure"
          test "${{ steps.fail.outputs.passed }}" = "false"
